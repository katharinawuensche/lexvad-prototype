<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexVAD20 — Lexikalischer Variation Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body { background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
    @font-face {
      font-family: 'Liberation Mono';
      src: local('Liberation Mono'), local('LiberationMono'), local('Courier New');
    }
    select { appearance: none; -webkit-appearance: none; }
    input[type=range] {
      -webkit-appearance: none; height: 4px;
      background: #e2e8f0; border-radius: 2px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #0f172a; cursor: pointer;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <!-- Deck.gl -->
  <script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>

  <!-- Data (plain JS, no JSX) -->
  <script src="js/data.js?v=2"></script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="80" fill="#f8fafc"/>
      <rect x="8" y="8" width="104" height="12" rx="4" fill="#e2e8f0"/>
      <rect x="8" y="26" width="104" height="40" rx="6" fill="#fff" stroke="#e2e8f0"/>
      <circle cx="35" cy="43" r="5" fill="#f87171"/>
      <circle cx="55" cy="38" r="4" fill="#4ade80"/>
      <circle cx="72" cy="46" r="6" fill="#60a5fa"/>
      <circle cx="88" cy="40" r="4" fill="#c084fc"/>
      <circle cx="45" cy="52" r="3" fill="#f87171"/>
      <circle cx="65" cy="50" r="4" fill="#60a5fa"/>
      <rect x="8" y="70" width="50" height="4" rx="2" fill="#e2e8f0"/>
    </svg>
  </template>
  <meta name="ext-resource-dependency" content="https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png" data-resource-id="carto_tiles">
  <meta name="ext-resource-dependency" content="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tiro+Bangla&display=swap" data-resource-id="google_fonts">
</head>
<body>
  <div id="root"></div>

  <!-- Components (JSX, order matters: shared first, app last) -->
  <script type="text/babel" src="js/Header.jsx"></script>
  <script type="text/babel" src="js/Sidebar.jsx"></script>
  <script type="text/babel" src="js/MapPanel.jsx"></script>
  <script type="text/babel" src="js/ComparePanel.jsx"></script>
  <script type="text/babel" src="js/DistributionChart.jsx"></script>
  <script type="text/babel" src="js/BelegDB.jsx"></script>
  <script type="text/babel" src="js/App.jsx"></script>
</body>
</html>
